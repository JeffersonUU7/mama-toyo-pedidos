# Cluster: 2 nodos (Apache + Express cada uno) + Nginx como balanceador + PostgreSQL compartido.
# Cadena: Nginx -> apache1 -> app1  /  Nginx -> apache2 -> app2  -> db
# HTTPS: Nginx (:8443) y cada Apache usan el certificado de certs/ -> ANTES de levantar:  bash certs/generar-certificado.sh
# Entrada: https://localhost:8443  (http://localhost:8080 redirige a HTTPS).
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=toyo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-toyo_local}
      - POSTGRES_DB=toyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyo -d toyo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app1:
    build: .
    environment:
      - NODE_ID=nodo-1
      - PORT=3000
      - REQUIRE_DB=true   # si falta DATABASE_URL el nodo no arranca (no cae a memoria en silencio)
      - DATABASE_URL=postgres://toyo:${POSTGRES_PASSWORD:-toyo_local}@db:5432/toyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build: .
    environment:
      - NODE_ID=nodo-2
      - PORT=3000
      - REQUIRE_DB=true   # si falta DATABASE_URL el nodo no arranca (no cae a memoria en silencio)
      - DATABASE_URL=postgres://toyo:${POSTGRES_PASSWORD:-toyo_local}@db:5432/toyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  apache1:
    image: httpd:2.4-alpine
    environment:
      - BACKEND=app1:3000
    volumes:
      - ./apache/httpd-nodo.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./web:/usr/local/apache2/htdocs:ro
      - ./certs:/usr/local/apache2/conf/certs:ro
    depends_on:
      - app1
    restart: unless-stopped

  apache2:
    image: httpd:2.4-alpine
    environment:
      - BACKEND=app2:3000
    volumes:
      - ./apache/httpd-nodo.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./web:/usr/local/apache2/htdocs:ro
      - ./certs:/usr/local/apache2/conf/certs:ro
    depends_on:
      - app2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"     # solo redirige a HTTPS
      - "8443:443"    # entrada HTTPS del cluster
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/proxy.inc:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - apache1
      - apache2
    restart: unless-stopped

volumes:
  pgdata:

