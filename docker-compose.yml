# Clúster base: 2 nodos de la app + Nginx como balanceador (punto de entrada único).
# HTTPS en Nginx se agrega en la Clase 37 (ver docs/DECISIONES.md).
services:
  app1:
    build: .
    environment:
      - NODE_ID=nodo-1
      - PORT=3000
    restart: unless-stopped

  app2:
    build: .
    environment:
      - NODE_ID=nodo-2
      - PORT=3000
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
