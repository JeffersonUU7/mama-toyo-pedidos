# Cluster: 2 nodos (Apache + Express cada uno) + Nginx como balanceador + PostgreSQL compartido.
# Cadena: Nginx -> apache1 -> app1  /  Nginx -> apache2 -> app2  -> db
# HTTPS en Nginx se agrega en la etapa 3 (ver docs/DECISIONES.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=toyo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-toyo_local}
      - POSTGRES_DB=toyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyo -d toyo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app1:
    build: .
    environment:
      - NODE_ID=nodo-1
      - PORT=3000
      - DATABASE_URL=postgres://toyo:${POSTGRES_PASSWORD:-toyo_local}@db:5432/toyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build: .
    environment:
      - NODE_ID=nodo-2
      - PORT=3000
      - DATABASE_URL=postgres://toyo:${POSTGRES_PASSWORD:-toyo_local}@db:5432/toyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  apache1:
    image: httpd:2.4-alpine
    environment:
      - BACKEND=app1:3000
    volumes:
      - ./apache/httpd-nodo.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./web:/usr/local/apache2/htdocs:ro
    depends_on:
      - app1
    restart: unless-stopped

  apache2:
    image: httpd:2.4-alpine
    environment:
      - BACKEND=app2:3000
    volumes:
      - ./apache/httpd-nodo.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./web:/usr/local/apache2/htdocs:ro
    depends_on:
      - app2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - apache1
      - apache2
    restart: unless-stopped

volumes:
  pgdata:

