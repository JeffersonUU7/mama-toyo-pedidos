# Cluster base: 2 nodos de la app + Nginx como balanceador + PostgreSQL compartido.
# HTTPS en Nginx se agrega en la Clase 37 (ver docs/DECISIONES.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=toyo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-toyo_local}
      - POSTGRES_DB=toyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyo -d toyo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app1:
    build: .
    environment:
      - NODE_ID=nodo-1
      - PORT=3000
      - DATABASE_URL=postgres://toyo:${POSTGRES_PASSWORD:-toyo_local}@db:5432/toyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build: .
    environment:
      - NODE_ID=nodo-2
      - PORT=3000
      - DATABASE_URL=postgres://toyo:${POSTGRES_PASSWORD:-toyo_local}@db:5432/toyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

volumes:
  pgdata:
