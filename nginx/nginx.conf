upstream cluster_app {
    # round-robin por defecto. Si un nodo falla 2 veces seguidas,
    # Nginx lo saca de rotación durante 10 s (health check pasivo).
    server app1:3000 max_fails=2 fail_timeout=10s;
    server app2:3000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://cluster_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Servido-Por $upstream_addr always;
    }
}
