# Nginx = punto de entrada unico del cluster (Decision 2).
# Cadena: Nginx --HTTPS--> apache1 -> app1  /  Nginx --HTTPS--> apache2 -> app2  -> db
# Cliente --HTTPS (:8443)--> Nginx.  El puerto 8080 solo redirige a HTTPS.
server_tokens off;

# Docker DNS. Con "resolve" Nginx vuelve a consultar la IP de apache1/apache2 cada pocos segundos:
# si un contenedor se recrea y cambia de IP, Nginx lo sigue (antes la IP quedaba fija desde el arranque).
# (El parametro "resolve" del upstream requiere nginx >= 1.27.3; la imagen es 1.27-alpine.)
resolver 127.0.0.11 valid=5s ipv6=off;

upstream cluster_app {
    zone cluster_app 64k;
    server apache1:443 max_fails=2 fail_timeout=10s resolve;
    server apache2:443 max_fails=2 fail_timeout=10s resolve;
}

# Limite de peticiones de ESCRITURA (crear pedido / marcar listo) por IP.
# Las lecturas (menu, consulta, health) no se limitan. Clave vacia = sin limite.
map $request_method $clave_escritura {
    POST    $binary_remote_addr;
    PATCH   $binary_remote_addr;
    default "";
}
limit_req_zone $clave_escritura zone=escritura:10m rate=30r/s;
limit_req_status 429;

# Cocina: PATCH exige usuario y contrasena; las demas rutas de pedidos son publicas
# (el cliente crea y consulta su pedido sin cuenta).
map $request_method $auth_pedidos {
    PATCH   "Cocina Mama Toyo";
    default off;
}

# --- HTTP (80, publicado como 8080): solo redirige a HTTPS ---
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

# --- HTTPS (443, publicado como 8443) ---
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    # HSTS corto (5 min) igual que Apache: en local no queremos forzar HTTPS en otros localhost.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 16k;

    location / {
        include /etc/nginx/proxy.inc;
    }

    # Pantalla y API de cocina: solo personal (usuario y contrasena en nginx/htpasswd).
    location = /cocina.html {
        auth_basic "Cocina Mama Toyo";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy.inc;
    }
    location ~ ^/(api/)?cocina$ {
        auth_basic "Cocina Mama Toyo";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy.inc;
    }

    # Pedidos: GET y POST publicos; PATCH (marcar listo) con contrasena. Escrituras con limite por IP.
    location ~ ^/(api/)?pedidos(/|$) {
        limit_req zone=escritura burst=60 nodelay;
        auth_basic $auth_pedidos;
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy.inc;
    }
}
