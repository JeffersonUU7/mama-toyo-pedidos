# Nginx = punto de entrada unico. Balancea hacia el Apache de cada nodo (Decision 2, etapa 2).
# Cadena: Nginx -> apache1 -> app1  /  Nginx -> apache2 -> app2
# HTTPS en Nginx (y hacia los Apache) se agrega en la etapa 3.
upstream cluster_app {
    zone cluster_app 64k;
    server apache1:80 max_fails=2 fail_timeout=10s;
    server apache2:80 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://cluster_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_500 http_502 http_503;
    }
}
