# Fase 2: servidor web Apache (HTTPS + reverse proxy) y contenedor Express, juntos.
#   1) bash certs/generar-certificado.sh
#   2) docker compose -f apache/docker-compose.apache.yml up --build
# Entrar por https://localhost:8443
services:
  app:
    build:
      context: ..            # raiz del repositorio (usa el Dockerfile de ahi)
    environment:
      - NODE_ID=app
      - PORT=3000
    restart: unless-stopped

  apache:
    image: httpd:2.4-alpine
    ports:
      - "8081:80"
      - "8443:443"
    depends_on:
      - app
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ../web:/usr/local/apache2/htdocs:ro
      - ../certs:/usr/local/apache2/conf/certs:ro
    restart: unless-stopped
