# Apache de CADA NODO del cluster (Decision 2, etapa 2). Imagen oficial httpd:2.4-alpine.
# Sirve web/ (estatico) y reenvia /api y /health al Express de SU nodo.
# El destino llega por la variable de entorno BACKEND (apache1 -> app1:3000, apache2 -> app2:3000).
# Escucha HTTPS (puerto 443) con el certificado de certs/: Nginx le habla cifrado (etapa 3).
# No se publica al exterior: solo Nginx (misma red de Docker) puede llegar a el.
# El Apache independiente de la etapa 1 sigue usando apache/httpd.conf (con HTTPS propio).

ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

User daemon
Group daemon

ServerTokens Prod
ServerSignature Off

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types
DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

<VirtualHost *:443>
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    "/usr/local/apache2/conf/certs/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/server.key"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Si el Express de este nodo no responde, Apache contesta 502/503 y Nginx reintenta con el otro nodo.
    ProxyTimeout 10
    ProxyPreserveHost On
    ProxyPass        /api    http://${BACKEND}/api connectiontimeout=2
    ProxyPassReverse /api    http://${BACKEND}/api
    ProxyPass        /health http://${BACKEND}/health connectiontimeout=2
    ProxyPassReverse /health http://${BACKEND}/health
</VirtualHost>
