# Apache httpd 2.4 (imagen oficial httpd:2.4-alpine)
# Sirve la carpeta web/ (estatico) y reenvia la API al puerto 3000. HTTPS con certificado autofirmado.

ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User daemon
Group daemon

# Ocultar version del servidor
ServerTokens Prod
ServerSignature Off

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types
DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

# Cerrar todo por defecto, abrir solo la carpeta web/
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# --- HTTP (80): redirige todo a HTTPS ---
<VirtualHost *:80>
    Redirect permanent / https://localhost:8443/
</VirtualHost>

# --- HTTPS (443) ---
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
<VirtualHost *:443>
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    "/usr/local/apache2/conf/certs/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/server.key"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Dinamico -> Express en el puerto 3000.
    # Ronda 1: nodo unico (la app corriendo en la maquina con npm run dev).
    # Ronda 2/3: cambiar el destino al balanceador (nginx:80) segun docs/DECISIONES.md, Pendiente 3.
    ProxyPreserveHost On
    ProxyPass        /menu    http://host.docker.internal:3000/menu
    ProxyPassReverse /menu    http://host.docker.internal:3000/menu
    ProxyPass        /pedidos http://host.docker.internal:3000/pedidos
    ProxyPassReverse /pedidos http://host.docker.internal:3000/pedidos
    ProxyPass        /cocina  http://host.docker.internal:3000/cocina
    ProxyPassReverse /cocina  http://host.docker.internal:3000/cocina
    ProxyPass        /health  http://host.docker.internal:3000/health
    ProxyPassReverse /health  http://host.docker.internal:3000/health
</VirtualHost>
